<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dynamo KV store simulator</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <header>
          <h1>Dynamo KV store</h1>
          <p id="status"></p>
        </header>
        <svg id="ring" viewBox="-425 -425 850 850" role="img" aria-label="Cluster ring"></svg>
        <footer class="legend">
          <span><i class="sw alive"></i>alive</span>
          <span><i class="sw suspect"></i>doubted</span>
          <span><i class="sw dead"></i>called dead</span>
          <span class="gap"></span>
          <span><i class="dot client"></i>request</span>
          <span><i class="dot rep"></i>copying</span>
          <span><i class="dot repair"></i>fixing</span>
          <span class="gap"></span>
          <span><i class="dot key-ok"></i>key</span>
          <span><i class="dot key-divergent"></i>copies disagree</span>
          <span><i class="dot key-siblings"></i>two versions</span>
          <p>Outer circle: the nodes, coloured by what the others believe (dashed means really down). Inner circle: the keys. Tap a key to see which 3 nodes hold it.</p>
        </footer>
      </main>
      <aside id="side"></aside>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
