<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dynamo KV store simulator</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <header>
          <h1>Dynamo KV store</h1>
          <p id="status"></p>
        </header>
        <svg id="ring" viewBox="-500 -500 1000 1000" role="img" aria-label="Cluster ring"></svg>
        <footer class="legend">
          <span><i class="sw alive"></i>alive</span>
          <span><i class="sw suspect"></i>suspect</span>
          <span><i class="sw dead"></i>dead</span>
          <span class="gap"></span>
          <span><i class="dot gossip"></i>gossip</span>
          <span><i class="dot client"></i>client request</span>
          <span><i class="dot rep"></i>replication</span>
          <span><i class="dot repair"></i>repair</span>
          <span class="gap"></span>
          <span><i class="dot key-ok"></i>key in sync</span>
          <span><i class="dot key-divergent"></i>out of sync</span>
          <span><i class="dot key-siblings"></i>siblings</span>
          <p>Each node's halo shows what every peer believes about it. The inner ring is the hash space: ticks are virtual nodes, dots are keys.</p>
        </footer>
      </main>
      <aside id="side"></aside>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
